<!DOCTYPE html>
<html lang="en">
<head>
    <link rel-"icon" type="image/png" href="Favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Evaluation Engine</title>
    <style>
        :root {
            --bg-deep: #06090e;
            --panel-navy: #0d1424;
            --border-muted: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --terminal-gray: #475569;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-nav {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background-color: var(--panel-navy);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .pipeline-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #2ea44f;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ea44f;
        }
        .system-time {
            font-family: monospace;
            background-color: #06090e;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-muted);
            color: var(--text-muted);
        }
        .input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .password-box {
            flex: 1;
            background-color: #06090e;
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            color: var(--text-main);
            padding: 12px 16px;
            font-size: 15px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        .password-box:focus {
            border-color: #38bdf8;
        }
        .toggle-btn {
            background-color: #1e293b;
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            color: var(--text-main);
            padding: 0 16px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .toggle-btn:hover {
            background-color: #334155;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background-color: #06090e;
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--terminal-gray);
            transition: width 0.4s ease, background-color 0.4s ease;
        }
        .display-output {
            background-color: #06090e;
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 20px;
        }
        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .entropy-hero {
            font-family: monospace;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }
        .classification {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }
        .grid-data {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--border-muted);
            padding-top: 15px;
            font-size: 13px;
        }
        .grid-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .row-label {
            color: var(--text-muted);
        }
        .row-value {
            font-family: monospace;
            font-weight: 500;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="header-section">
        <div class="header-nav">Security // Password // Strength // Analyser // v1.2</div>
        <h1>Cryptographic Evaluation Engine</h1>
        <p class="subtitle">Real-time Password analysis</p>
    </div>
    <div class="container" id="mainContainer">
        <div class="status-header">
            <div class="pipeline-status">
                <span class="pulse-dot"></span> Real-Time Cloud Pipeline Active
            </div>
            <div class="system-time">NODE_ONLINE</div>
        </div>
        <div class="input-wrapper">
            <input type="password" id="passwordInput" placeholder="Enter password to begin audit..." class="password-box">
            <button id="toggleBtn" class="toggle-btn">👁 Show</button>
        </div>
        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="display-output">
            <div class="panel-title">METRICS //</div>
            <div id="entropyHero" class="entropy-hero">Awaiting Input</div>
            <div id="classification" class="classification">System Idle</div>
            <div id="gridData" class="grid-data" style="display: none;"></div>
        </div>
    </div>
    <script>
        const passwordInput = document.getElementById('passwordInput');
        const toggleBtn = document.getElementById('toggleBtn');
        const progressBar = document.getElementById('progressBar');
        const entropyHero = document.getElementById('entropyHero');
        const classification = document.getElementById('classification');
        const gridData = document.getElementById('gridData');
        const mainContainer = document.getElementById('mainContainer');
        let debounceTimer;

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '👁 Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁 Show';
            }
        });

        passwordInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const password = passwordInput.value;

            if (!password) {
                entropyHero.innerText = "Awaiting Input";
                entropyHero.style.color = "var(--text-muted)";
                classification.innerText = "System Idle";
                classification.style.color = "var(--text-muted)";
                progressBar.style.width = "0%";
                progressBar.style.backgroundColor = "var(--terminal-gray)";
                gridData.style.display = "none";
                mainContainer.style.boxShadow = "0 10px 30px rgba(0,0,0,0.5)";
                mainContainer.style.borderColor = "var(--border-muted)";
                return;
            }

            debounceTimer = setTimeout(async () => {
                entropyHero.innerText = "Analyzing search streams...";
                entropyHero.style.color = "var(--text-muted)";

                try {
                    const response = await fetch('https://password-strength-checker-o8aq.onrender.com/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: password })
                    });
                    
                    const data = await response.json();

                    if (data.status === "rejected" || data.status === "pwned") {
                        entropyHero.innerText = data.message;
                        entropyHero.style.color = "#ef4444";
                        classification.innerText = "REJECTED BY RULES PROTOCOL";
                        classification.style.color = "#ef4444";
                        progressBar.style.width = "100%";
                        progressBar.style.backgroundColor = "#ef4444";
                        gridData.style.display = "none";
                        mainContainer.style.boxShadow = "0 0 20px rgba(239, 68, 68, 0.2)";
                        mainContainer.style.borderColor = "#ef4444";
                    } else {
                        let targetColor = "#64748b";
                        let fillPercentage = "20%";
                        let strengthLabel = "Vulnerable";

                        if (data.color === "red") {
                            targetColor = "#f85149"; fillPercentage = "20%"; strengthLabel = "Cryptographically Weak";
                        } else if (data.color === "orange") {
                            targetColor = "#d29922"; fillPercentage = "40%"; strengthLabel = "Moderate / Guessable";
                        } else if (data.color === "blue") {
                            targetColor = "#58a6ff"; fillPercentage = "65%"; strengthLabel = "Secure Structural Array";
                        } else if (data.color === "darkgreen") {
                            targetColor = "#238636"; fillPercentage = "85%"; strengthLabel = "Highly Secure Passphrase";
                        } else if (data.color === "green") {
                            targetColor = "#2ea44f"; fillPercentage = "100%"; strengthLabel = "Maximum Enterprise Strength";
                        }

                        entropyHero.innerText = `Entropy: ${data.entropy_bits} Bits`;
                        entropyHero.style.color = targetColor;
                        classification.innerText = strengthLabel;
                        classification.style.color = targetColor;
                        
                        progressBar.style.width = fillPercentage;
                        progressBar.style.backgroundColor = targetColor;

                        mainContainer.style.boxShadow = `0 0 25px ${targetColor}2b`;
                        mainContainer.style.borderColor = targetColor;

                        gridData.innerHTML = `
                            <div class="grid-row"><span class="row-label">Character Length</span><span class="row-value" style="color: ${targetColor}">${data.length}</span></div>
                            <div class="grid-row"><span class="row-label">Active Pool Space</span><span class="row-value">${data.pool_size} choices [${data.pool_used}]</span></div>
                            <div class="grid-row"><span class="row-label">Patterns Flagged</span><span class="row-value">${data.patterns_flagged}</span></div>
                            <div class="grid-row"><span class="row-label">Total Combinations</span><span class="row-value">${data.combinations}</span></div>
                            <div class="grid-row"><span class="row-label">Brute-Force Window</span><span class="row-value" style="color: ${targetColor}">${data.crack_time}</span></div>
                        `;
                        gridData.style.display = "flex";
                    }
                } catch (error) {
                    entropyHero.innerText = "API Engine Unreachable";
                    entropyHero.style.color = "#ef4444";
                    classification.innerText = "Check backend connection parameters.";
                    gridData.style.display = "none";
                }
            }, 300);
        });
    </script>
</body>
</html>
